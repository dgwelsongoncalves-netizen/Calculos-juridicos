name: Gerar Instalador Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas fixadas
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Validar sintaxe e importacao do nash.py antes de empacotar
        run: |
          python -m py_compile nash.py interface_v3.py
          python -c "import nash; print('Nash importado com sucesso! Versao:', nash.__version__)"

      - name: Fabricar o aplicativo Windows (OneFile)
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "nash" --icon=dr_nash.ico --add-data "dr_nash.ico;." --add-data "nash.py;." --hidden-import=nash --hidden-import=pandas --hidden-import=openpyxl --hidden-import=bcb interface_v3.py

      - name: Compilar o Instalador (Inno Setup)
        run: iscc gerador_nash.iss

      - name: Extrair versao do Nash para Tag
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path "nash.py" -Raw -Encoding UTF8
          if ($content -match '__version__\s*=\s*["\x27]([^"\x27]+)["\x27]') {
            $ver = $matches[1]
          } else {
            $ver = "4.1.5"
          }
          Write-Output "versao=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "Versao detectada: $ver"

      - name: Publicar Release e Instalador no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: Instalador_Final/Instalador_Nash_System.exe
          tag_name: v${{ steps.get_version.outputs.versao }}
          name: Nash System v${{ steps.get_version.outputs.versao }}
          body: "Instalador oficial com modulo nash embutido, interface guiada, auto-save e sincronizacao da Tabela TJMG."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}