name: Gerar Instalador Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas fixadas
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Validar sintaxe do Python antes de compilar
        run: |
          python -m py_compile nash.py interface_v3.py

      - name: Fabricar o aplicativo Windows (OneFile)
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "nash" --icon=dr_nash.ico --add-data "dr_nash.ico;." interface_v3.py

      - name: Compilar o Instalador (Inno Setup)
        run: iscc gerador_nash.iss

      - name: Verificar se o Instalador do Inno Setup foi gerado
        shell: pwsh
        run: |
          if (-Not (Test-Path "Instalador_Final/Instalador_Nash_System.exe")) {
            Write-Error "O Inno Setup nao gerou o arquivo Instalador_Final/Instalador_Nash_System.exe!"
            exit 1
          }
          $item = Get-Item "Instalador_Final/Instalador_Nash_System.exe"
          Write-Host "Instalador Inno Setup validado com sucesso: $($item.FullName) ($($item.Length) bytes)"

      - name: Extrair versao do Nash para Tag Limpa
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path "nash.py" -Raw -Encoding UTF8
          if ($content -match '__version__\s*=\s*["\x27]([^"\x27]+)["\x27]') {
            $ver = $matches[1].Trim()
          } else {
            $ver = "4.1.5"
          }
          Write-Output "tag=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "versao=$ver" >> $env:GITHUB_OUTPUT
          Write-Output "Tag limpa gerada: v$ver"

      - name: Publicar Release e Instalador no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: Instalador_Final/Instalador_Nash_System.exe
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Nash System v${{ steps.get_version.outputs.versao }}
          body: "Instalador oficial Inno Setup do Nash System v${{ steps.get_version.outputs.versao }}."
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}