name: Gerar Executavel Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar o codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 

    - name: Instalar bibliotecas fixadas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fabricar o aplicativo Windows
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon=dr_nash.ico --add-data "dr_nash.ico;." --name="Nash_System" nash.py

    - name: Salvar pacote para download
      uses: actions/upload-artifact@v4
      with:
        name: Nash_System_Windows
        path: dist/Nash_System
