name: Gerar Instalador Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas fixadas
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Fabricar o aplicativo Windows (OneFile)
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "nash" --icon=dr_nash.ico --add-data "dr_nash.ico;." interface_v3.py

      - name: Compilar o Instalador (Inno Setup)
        run: iscc gerador_nash.iss

      - name: Organizar executavel para upload
        run: |
          New-Item -ItemType Directory -Force -Path "dist_instalador"
          $exe = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.FullName -notmatch "pyinstaller" } | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist_instalador/Instalador_Nash_System.exe"
            Write-Host "Instalador encontrado e copiado de: $($exe.FullName)"
          } else {
            Write-Error "Instalador .exe nao encontrado pelo script!"
            exit 1
          }

      - name: Extrair versao do Nash e criar Tag Unica
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path "nash.py" -Raw -Encoding UTF8
          if ($content -match '__version__\s*=\s*["\x27]([^"\x27]+)["\x27]') {
            $ver = $matches[1]
          } else {
            $ver = "4.1.5"
          }
          # Adiciona timestamp para garantir que a tag nunca duplique no GitHub e evite "Too many retries"
          $tag = "v$ver-" + (Get-Date -Format "yyyyMMdd-HHmmss")
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "Tag gerada: $tag"

      - name: Publicar Release e Instalador no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist_instalador/Instalador_Nash_System.exe
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Nash System Release (${{ steps.get_version.outputs.tag }})
          body: "Instalador oficial gerado automaticamente pelo GitHub Actions."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}